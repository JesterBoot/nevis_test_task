services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:${POSTGRES_DATA_DIR}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: ${DB_HEALTHCHECK_INTERVAL}
      timeout: ${DB_HEALTHCHECK_TIMEOUT}
      retries: ${DB_HEALTHCHECK_RETRIES}

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      MODEL_CACHE_DIR: ${DOCKER_MODEL_CACHE_DIR}
      MODEL_READY_FILE: ${DOCKER_MODEL_READY_FILE}
      API_HOST: ${API_HOST}
      API_CONTAINER_PORT: ${API_CONTAINER_PORT}
      MAX_DOCUMENT_CHARS: ${MAX_DOCUMENT_CHARS}
      MAX_CHUNKS: ${MAX_CHUNKS}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      SEARCH_LIMIT_DEFAULT: ${SEARCH_LIMIT_DEFAULT}
      SEARCH_LIMIT_MAX: ${SEARCH_LIMIT_MAX}
      FTS_BOOST: ${FTS_BOOST}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-1}
      HF_HUB_OFFLINE: ${DOCKER_HF_HUB_OFFLINE}
      TRANSFORMERS_OFFLINE: ${DOCKER_TRANSFORMERS_OFFLINE}
    ports:
      - "${API_PORT}:${API_CONTAINER_PORT}"
    volumes:
      - model_cache:${DOCKER_MODEL_CACHE_DIR}
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')",
        ]
      interval: ${API_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${API_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${API_HEALTHCHECK_RETRIES:-10}
      start_period: ${API_HEALTHCHECK_START_PERIOD:-15s}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME}
  model_cache:
    name: ${MODEL_VOLUME}
