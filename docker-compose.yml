services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nevis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nevis}
      POSTGRES_USER: ${POSTGRES_USER:-nevis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nevis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: nevis-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nevis}
      POSTGRES_USER: ${POSTGRES_USER:-nevis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nevis}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      MODEL_CACHE_DIR: /opt/models
      MODEL_READY_FILE: /opt/models/.model-ready
      API_HOST: 0.0.0.0
      API_CONTAINER_PORT: "8080"
      DEBUG: ${DEBUG:-0}
      MAX_DOCUMENT_CHARS: ${MAX_DOCUMENT_CHARS:-50000}
      MAX_CHUNKS: ${MAX_CHUNKS:-100}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      SEARCH_LIMIT_DEFAULT: ${SEARCH_LIMIT_DEFAULT:-10}
      SEARCH_LIMIT_MAX: ${SEARCH_LIMIT_MAX:-50}
      FTS_BOOST: ${FTS_BOOST:-0.10}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.30}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - model_cache:/opt/models
      - ./src:/app/src
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  model_cache:
